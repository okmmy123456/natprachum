<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle border for crispness on dark/light tabs -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Calendar Body -->
  <rect x="110" y="140" width="292" height="255" rx="36" fill="#FFFFFF" />
  
  <!-- Calendar Header Stripe -->
  <path d="M 110 176 C 110 156.1 126.1 140 146 140 L 366 140 C 385.9 140 402 156.1 402 176 L 402 216 L 110 216 Z" fill="url(#headerGrad)" />

  <!-- Calendar Binder Rings -->
  <rect x="176" y="108" width="30" height="60" rx="15" fill="#E2E8F0" stroke="#1E293B" stroke-width="6" />
  <rect x="306" y="108" width="30" height="60" rx="15" fill="#E2E8F0" stroke="#1E293B" stroke-width="6" />

  <!-- Clock / Meeting Time in Calendar Center -->
  <circle cx="256" cy="304" r="62" fill="#F8FAFC" stroke="#4F46E5" stroke-width="14" />
  <polyline points="256,270 256,304 286,318" fill="none" stroke="#4F46E5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Checkmark / Confirmed Booking Badge -->
  <circle cx="366" cy="366" r="42" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="8" />
  <path d="M 352 366 L 362 376 L 382 354" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
